<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2e9">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="canonical" href="{% block canonical %}https://stenly.ai/{% endblock canonical %}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}">
  <meta property="og:description" content="{{ config.description }}">
  <meta property="og:url" content="{% block og_url %}https://stenly.ai/{% endblock og_url %}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site.css">
  <script src="/site.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock body_class %}" data-apple-icon="/icons/apple.svg" data-linux-icon="/icons/linux.svg">
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="cover">
    <header class="masthead flex items-center justify-between gap-6">
      <a class="wordmark inline-flex items-center gap-2" href="/" aria-label="Stenly home"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M8 18v4m6-11v18m6-24v30m6-22v14m6-9v4"/></svg><span>stenly</span><span class="wordmark-period">.</span></a>
      <nav class="flex items-center gap-7" aria-label="Main navigation">
        <a class="nav-link{% block pricing_current %}{% endblock pricing_current %}" href="/pricing/">Pricing</a>
        <a class="source-link" href="{{ config.extra.repository_url }}">Source on GitHub</a>
        <a class="nav-link" href="/#get-stenly">Availability</a>
      </nav>
    </header>

{% block main %}{% endblock main %}

    <footer class="colophon flex items-center justify-between gap-5"><span>Know who said what. Carry the context forward.</span></footer>
  </div>
</body>
</html>
