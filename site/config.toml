base_url = "https://stenly.ai"
title = "Stenly — Know who said what. Bring the meeting to your agent."
description = "A local-first meeting recorder and dictation app for macOS and Linux. Real speaker names, Obsidian notes, and meeting context for coding agents. No bot joins the call."
compile_sass = false
build_search_index = false
minify_html = true

[extra]
repository_url = "https://github.com/wbunting/stenly"
# Stable GitHub release asset names published by the tag workflow.
macos_download_url = "https://github.com/wbunting/stenly/releases/latest/download/stenly-macos.dmg"
# Release notes for the build served by macos_download_url.
release_notes_url = "https://github.com/wbunting/stenly/releases/latest"
# Minimum macOS for the bundle (LSMinimumSystemVersion in scripts/bundle-macos.sh).
macos_min_version = "14.2"
# NOT linked from any page: no Linux asset is published yet, so this URL would 404.
linux_download_url = "https://github.com/wbunting/stenly/releases/latest/download/stenly-linux.tar.gz"
# Per-distro pre-release setup guides linked from the home page.
linux_install_options = [
  { name = "Ubuntu / Debian", url = "/install/ubuntu/" },
  { name = "Fedora", url = "/install/fedora/" },
  { name = "Arch Linux", url = "/install/arch/" },
]
# Pricing shown on / and /pricing/ (decided in Linear DEV-23): the source is MIT and
# free to build; the signed, notarized macOS app is a one-time licence for one Mac,
# updates included, after a free trial. free_meetings must equal FREE_MEETINGS in
# crates/stenly-core/src/license.rs (a site test checks it).
license_price = "$10"
free_meetings = 10
# Hosted checkout page the Buy button opens (a public URL, not a secret). Leave empty
# to hide the Buy link. Polar checkout link "stenly.ai Buy" for product "Stenly for Mac".
checkout_url = "https://buy.polar.sh/polar_cl_AW5WIhHP8358jeLjFn5luZWRAra4akTRm4syT4Ec1W8"
# Team contact destination; dead placeholder until a contact flow exists.
team_contact_url = "mailto:hello@stenly.ai?subject=Stenly%20for%20teams"
# Optional external hosted service. No sign-in is advertised until this is set.
hosted_url = ""
