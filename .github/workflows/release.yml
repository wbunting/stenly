name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: macOS signed + notarized DMG
    runs-on: macos-14
    env:
      STENLY_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      STENLY_NOTARY_PROFILE: stenly-notary
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/stenly-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/stenly-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Store notary API key in the ephemeral keychain
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool store-credentials "$STENLY_NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --no-validate
      - name: Build, sign, notarize, and staple DMG
        run: scripts/bundle-macos.sh
        env:
          STENLY_UNIVERSAL: "1"
          # CI must never silently fall back to the script's contributor-safe
          # ad-hoc development mode.
          STENLY_REQUIRE_DEVELOPER_ID: "1"
          # notarytool's explicit keychain keeps the profile in the same
          # ephemeral keychain that holds the imported Developer ID cert.
          STENLY_NOTARY_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
      - name: Verify signed DMG
        run: |
          set -euo pipefail
          hdiutil attach -readonly -nobrowse target/release/distribution/stenly-macos.dmg -mountpoint "$RUNNER_TEMP/stenly-dmg"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/stenly-dmg/Stenly.app"
          for binary in stenly stenly-cli stenly-mcp stenly-speech; do
            lipo -archs "$RUNNER_TEMP/stenly-dmg/Stenly.app/Contents/MacOS/$binary" | grep -Eq 'arm64.*x86_64|x86_64.*arm64'
          done
          spctl -a -vvv -t exec "$RUNNER_TEMP/stenly-dmg/Stenly.app"
          spctl -a -vvv -t open --context context:primary-signature target/release/distribution/stenly-macos.dmg
          xcrun stapler validate -v target/release/distribution/stenly-macos.dmg
          hdiutil detach "$RUNNER_TEMP/stenly-dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: stenly-macos
          path: target/release/distribution/stenly-macos.dmg

  linux:
    name: Linux x86_64 tarball
    # Build against glibc 2.35 so the tarball also runs on Ubuntu 22.04 and
    # newer Debian-based desktops (rather than inheriting 24.04's glibc 2.39).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libwayland-dev libxkbcommon-x11-dev libvulkan-dev libfontconfig1-dev libdbus-1-dev \
            pkg-config clang
      - name: Build portable release tarball
        run: scripts/bundle-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stenly-linux
          path: target/release/distribution/stenly-linux.tar.gz

  publish:
    name: Publish GitHub release assets
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create release and upload stable download assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Stenly ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release-assets/stenly-macos/stenly-macos.dmg#stenly-macos.dmg \
            release-assets/stenly-linux/stenly-linux.tar.gz#stenly-linux.tar.gz
